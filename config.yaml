# =====================================================================
# Configuración del Generador DGII 606 y Agrupación de Compras
# =====================================================================

# Archivos y rutas por defecto
archivos:
  transacciones_defecto: "muestra.xlsx"
  proveedores_defecto: "Proveedores.xlsx"
  hoja_proveedores: "Hoja1"
  salida_defecto: "./salida"
  archivo_606: "formato_606.xlsx"
  archivo_606_csv: "formato_606.csv"
  archivo_agrupacion: "agrupacion_sin_comprobante.xlsx"
  archivo_incidencias: "incidencias.txt"

# Parámetros fiscales y de cálculo
fiscal:
  tasa_retencion_profesional: 0.15        # 15% servicios profesionales (honorarios, asesoría)
  tasa_retencion_no_profesional: 0.03     #  3% servicios no profesionales (mano de obra, etc.)
  
  # =======================================================================
  # CATÁLOGO DGII - TIPOS DE BIENES Y SERVICIOS COMPRADOS
  # 01 - GASTOS DE PERSONAL
  # 02 - GASTO POR TRABAJO, SUMINISTROS Y SERVICIOS
  # 03 - ARRENDAMIENTOS
  # 04 - GASTOS DE ACTIVOS FIJO
  # 05 - GASTOS DE REPRESENTACIÓN
  # 06 - OTRAS DEDUCCIONES ADMITIDAS
  # 07 - GASTOS FINANCIEROS
  # 08 - GASTOS EXTRAORDINARIOS
  # 09 - COMPRAS Y GASTOS QUE FORMARAN PARTE DEL COSTO DE VENTA
  # 10 - ADQUISICIONES DE ACTIVOS
  # 11 - GASTOS DE SEGUROS
  # =======================================================================
  tipo_bienes_servicios_606: "09 - COMPRAS Y GASTOS QUE FORMARAN PARTE DEL COSTO DE VENTA"
  tipo_retencion_isr: "02"                # 02 = Honorarios por servicios
  bienes_vs_servicios_606: "Bienes"       # Clasificación por defecto para compras con NCF en el 606
  
  # =======================================================================
  # CATÁLOGO DGII - FORMAS DE PAGO
  # 01 - EFECTIVO
  # 02 - CHEQUES/TRANSFERENCIAS/DEPÓSITO
  # 03 - TARJETA CREDITO/DEBITO
  # 04 - COMPRA A CRÉDITO
  # 05 - PERMUTA
  # 06 - NOTAS DE CRÉDITO
  # 07 - MIXTO
  # =======================================================================
  forma_pago_defecto_credito: "04 - COMPRA A CRÉDITO"
  forma_pago_defecto_pagado: "02 - CHEQUES/TRANSFERENCIAS/DEPÓSITO"

